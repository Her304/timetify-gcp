name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (Django, SQLite)
    runs-on: ubuntu-latest
    env:
      # Empty DSN disables the Sentry client initialised in settings.py, so a
      # red test can never page production.
      BACK_SENTRY_DSN: ""
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run test suite
        working-directory: backend
        run: python manage.py test main.tests --settings=backend.test_settings

  frontend-build:
    name: Frontend build (Vite + prerender)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        # Build only for now: `npm run lint` currently reports ~24 pre-existing
        # errors; add the lint step once those are fixed.
        run: npm run build
