<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Everything between the SEO markers is replaced per-route at build time by
      scripts/prerender.mjs. Keep the markers intact, and keep route-independent
      tags (icons, fonts, scripts) outside them or the prerendered pages lose them.
    -->
    <!-- SEO:START -->
    <title>Timetify — share your class schedule and find free time with friends</title>
    <meta name="description" content="Timetify puts you and your friends' class schedules side by side, so you can find a free timeslot everyone actually has. Free for students." />
    <link rel="canonical" href="https://timetify.net/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Timetify" />
    <meta property="og:url" content="https://timetify.net/" />
    <meta property="og:title" content="Timetify — share your class schedule and find free time with friends" />
    <meta property="og:description" content="Timetify puts you and your friends' class schedules side by side, so you can find a free timeslot everyone actually has. Free for students." />
    <meta property="og:image" content="https://timetify.net/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Timetify — a weekly class schedule with a shared free timeslot highlighted." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Timetify — share your class schedule and find free time with friends" />
    <meta name="twitter:description" content="Timetify puts you and your friends' class schedules side by side, so you can find a free timeslot everyone actually has. Free for students." />
    <meta name="twitter:image" content="https://timetify.net/og-cover.png" />
    <!-- SEO:END -->

    <meta name="theme-color" content="#ED6A4A" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!--
      Self-hosted fonts (scripts/fetch-fonts.mjs). Previously a render-blocking
      stylesheet on fonts.googleapis.com, which cost a DNS + TLS round trip to
      two third-party origins before any text could paint. The @font-face rules
      are inlined rather than linked so they cost no request at all; regenerate
      with the script and re-paste this block if the fonts change.

      Only the two families used above the fold are preloaded — preloading all
      six would have them compete with the JS bundle for bandwidth.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/bricolage-grotesque-latin.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/geist-latin.woff2" crossorigin>
    <style>
      /* Bricolage Grotesque — latin-ext */
      @font-face {
        font-family: 'Bricolage Grotesque';
        font-style: normal;
        font-weight: 300 700;
        font-stretch: 100%;
        font-display: swap;
        src: url(/fonts/bricolage-grotesque-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      /* Bricolage Grotesque — latin */
      @font-face {
        font-family: 'Bricolage Grotesque';
        font-style: normal;
        font-weight: 300 700;
        font-stretch: 100%;
        font-display: swap;
        src: url(/fonts/bricolage-grotesque-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* Geist — latin-ext */
      @font-face {
        font-family: 'Geist';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url(/fonts/geist-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      /* Geist — latin */
      @font-face {
        font-family: 'Geist';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url(/fonts/geist-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* Geist Mono — latin-ext */
      @font-face {
        font-family: 'Geist Mono';
        font-style: normal;
        font-weight: 400 600;
        font-display: swap;
        src: url(/fonts/geist-mono-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      /* Geist Mono — latin */
      @font-face {
        font-family: 'Geist Mono';
        font-style: normal;
        font-weight: 400 600;
        font-display: swap;
        src: url(/fonts/geist-mono-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>

    <!--
      The icon font is never part of the first paint, so it must not block it.
      The media="print" swap fetches the sheet at low priority and applies it on
      load; the <noscript> fallback keeps icons working without JS.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add_reaction,ads_click,arrow_upload_ready,auto_awesome_motion,chat_bubble,chevron_right,connect_without_contact,emoji_language,folder_shared,frame_person,groups_3,passkey,person_alert,qr_code,qr_code_scanner,rule,safety_divider,thumbs_up_double"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add_reaction,ads_click,arrow_upload_ready,auto_awesome_motion,chat_bubble,chevron_right,connect_without_contact,emoji_language,folder_shared,frame_person,groups_3,passkey,person_alert,qr_code,qr_code_scanner,rule,safety_divider,thumbs_up_double" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
