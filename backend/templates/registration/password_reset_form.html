{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-[#FCFAF5] p-10 rounded-[20px] border border-[#1F1A22]/10 shadow-[0_8px_40px_rgba(31,26,34,0.08)]">
        <div class="flex flex-col items-center text-center mb-8">
            <div class="flex items-center gap-2 mb-5">
                <div class="w-7 h-7 rounded-lg bg-[#ED6A4A] flex items-center justify-center">
                    <span class="font-display text-white text-base font-semibold leading-none">t</span>
                </div>
                <span class="font-display text-base font-medium text-[#1F1A22]">timetify</span>
            </div>
            <span class="font-mono-label text-[10px] font-medium tracking-[0.15em] uppercase text-[#1F1A22]/40 mb-3">Security</span>
            <h2 class="font-display text-2xl font-semibold text-[#1F1A22] tracking-tight">Reset your password</h2>
            <p class="mt-2 text-sm text-[#1F1A22]/60">Enter your email and we'll send you a reset link</p>
        </div>

        <form method="post" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block font-mono-label text-[10px] font-medium text-[#1F1A22]/50 uppercase tracking-[0.1em] mb-2 ml-1">
                    Email address
                </label>
                <input
                    type="email"
                    name="email"
                    id="id_email"
                    autocomplete="email"
                    required
                    class="w-full px-4 py-3 rounded-xl border border-[#1F1A22]/15 bg-white outline-none transition-all duration-200 placeholder:text-[#1F1A22]/30 text-[#1F1A22] text-sm"
                    placeholder="you@university.edu"
                    onfocus="this.style.borderColor='#ED6A4A'; this.style.boxShadow='0 0 0 3px rgba(237,106,74,0.15)'"
                    onblur="this.style.borderColor='rgba(31,26,34,0.15)'; this.style.boxShadow='none'"
                />
                {% if form.email.errors %}
                <div class="mt-1.5 flex items-start gap-1.5">
                    <svg class="w-4 h-4 text-red-500 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <p class="text-xs font-medium text-red-600">{{ form.email.errors.0 }}</p>
                </div>
                {% endif %}
            </div>

            <button
                type="submit"
                class="w-full py-3.5 px-4 rounded-xl text-sm font-semibold tracking-[0.01em] text-white bg-[#ED6A4A] hover:bg-[#C04A2E] transition-colors duration-200 shadow-[0_8px_20px_rgba(237,106,74,0.25)]"
            >
                SEND RESET LINK
            </button>

            <p class="text-center text-sm text-[#1F1A22]/60">
                Remember your password?
                <a href="{{ frontend_url }}/login" class="font-semibold text-[#ED6A4A] hover:text-[#C04A2E] transition-colors">
                    Back to login
                </a>
            </p>
        </form>
    </div>
</div>
{% endblock %}
